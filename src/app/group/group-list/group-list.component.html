<div class="groups-page page-shell">
  <app-page-header title="My Groups" icon="groups"
                   subtitle="Create and manage group conversations"></app-page-header>

  <div class="page-toolbar">
    <div class="toolbar-actions">
      <button mat-raised-button color="primary" (click)="createGroup()">
        <mat-icon>group_add</mat-icon>
        Create Group
      </button>
    </div>
  </div>

  <div class="page-scroll">
    <div class="groups-loading" *ngIf="isLoading">
      <app-shimmer variant="list" [rows]="6"></app-shimmer>
    </div>

    <ng-container *ngIf="!isLoading">
      <div class="groups-grid" *ngIf="groups.length > 0">
        <mat-card class="group-card" *ngFor="let group of groups" (click)="openGroup(group)">
          <mat-card-header>
            <div mat-card-avatar class="group-avatar">
              <mat-icon>group</mat-icon>
            </div>
            <mat-card-title>{{ group.name }}</mat-card-title>
            <mat-card-subtitle>
              {{ (group.members && group.members.length) || group.memberCount || 0 }} members
            </mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p *ngIf="group.description">{{ group.description | truncate:80 }}</p>
            <p class="muted" *ngIf="!group.description">No description</p>
          </mat-card-content>
          <mat-card-actions align="end">
            <button mat-button color="primary" (click)="openGroupChat(group, $event)">
              <mat-icon>chat</mat-icon>
              Open chat
            </button>
            <button mat-button (click)="openGroup(group, $event)">Manage</button>
          </mat-card-actions>
        </mat-card>
      </div>

      <div class="empty-state" *ngIf="groups.length === 0">
        <mat-icon>group_off</mat-icon>
        <h3>No groups yet</h3>
        <p>Create a group with accepted friends to start chatting together.</p>
        <button mat-raised-button color="primary" (click)="createGroup()">Create Your First Group</button>
      </div>
    </ng-container>
  </div>
</div>
