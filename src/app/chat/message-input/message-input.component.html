<div class="message-input-container" (click)="$event.stopPropagation()">
  <div class="file-preview" *ngIf="selectedFile">
    <mat-icon>attach_file</mat-icon>
    <span class="file-name">{{ selectedFile.name }}</span>
    <button mat-icon-button type="button" (click)="removeSelectedFile()" class="remove-file">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-progress-bar *ngIf="isUploading" mode="indeterminate" color="accent"></mat-progress-bar>

  <div class="composer-bar">
    <div class="composer-tools">
      <button mat-icon-button type="button" (click)="fileInput.click()" [disabled]="isUploading"
              matTooltip="Attach file" class="action-btn">
        <mat-icon>attach_file</mat-icon>
      </button>
      <input #fileInput type="file" hidden (change)="onFileSelected($event)"
             accept="image/*,.pdf,.doc,.docx,.txt">

      <div class="emoji-wrapper">
        <button #emojiButton mat-icon-button type="button"
                (click)="toggleEmojiPicker(); $event.stopPropagation()"
                matTooltip="Emoji" class="action-btn"
                [class.active]="showEmojiPicker || emojiClosing">
          <mat-icon>emoji_emotions</mat-icon>
        </button>
      </div>

      <button mat-icon-button type="button" (click)="openScheduleDialog()"
              matTooltip="Schedule message" class="action-btn">
        <mat-icon>schedule_send</mat-icon>
      </button>
    </div>

    <div class="composer-field">
      <textarea
        class="composer-textarea"
        [formControl]="messageControl"
        placeholder="Type a message..."
        rows="1"
        (keydown)="onKeyDown($event)"
        (input)="autoGrow($event)"
        autocomplete="off"></textarea>
    </div>

    <button mat-icon-button type="button" (click)="sendMessage()"
            [disabled]="isUploading || (!messageControl.value?.trim() && !selectedFile)"
            class="send-btn"
            [class.active]="messageControl.value?.trim() || selectedFile"
            matTooltip="Send message">
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>

<div #emojiPanel class="emoji-panel"
     *ngIf="showEmojiPicker || emojiClosing"
     [class.closing]="emojiClosing"
     (click)="$event.stopPropagation()"
     (mouseenter)="onEmojiPanelEnter()"
     (mouseleave)="onEmojiPanelLeave()">
  <app-emoji-picker
    (emojiSelected)="insertEmoji($event)"
    (closePicker)="closeEmojiPicker()">
  </app-emoji-picker>
</div>
