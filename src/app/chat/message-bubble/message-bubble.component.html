<div class="bubble-row" [ngClass]="{'row-own': isOwn, 'row-other': !isOwn}">
  <!-- Sender avatar / initials -->
  <app-avatar *ngIf="showAvatar"
    class="bubble-avatar"
    [imageUrl]="message.senderAvatar || ''"
    [name]="message.senderName || ''"
    [showStatus]="false"
    size="xs">
  </app-avatar>

  <div class="bubble" [ngClass]="{'bubble-own': isOwn, 'bubble-other': !isOwn}">
    <!-- Sender name (only for group chats, other people's messages) -->
    <span class="sender-name" *ngIf="!isOwn && isGroupChat" [style.color]="getSenderColor()">{{ message.senderName }}</span>

    <!-- Text Message -->
    <p class="message-text" *ngIf="isText()">{{ message.content }}</p>

    <!-- Image Message -->
    <div class="message-image" *ngIf="isImage()">
      <img [src]="message.attachmentUrl" alt="Image" (click)="openImage()">
    </div>

    <!-- File Message -->
    <div class="message-file" *ngIf="isFile()">
      <mat-icon>attach_file</mat-icon>
      <div class="file-info">
        <span class="file-name">{{ message.content }}</span>
      </div>
      <a [href]="message.attachmentUrl" target="_blank" mat-icon-button>
        <mat-icon>download</mat-icon>
      </a>
    </div>

    <!-- Message Meta (clock time + delivery/read status) -->
    <div class="message-meta">
      <small class="message-time" [attr.title]="message.createdAt | timeAgo">{{ message.createdAt | messageTime }}</small>
      <mat-icon *ngIf="isOwn" class="read-status" [ngClass]="statusClass">{{ statusIcon }}</mat-icon>
    </div>
  </div>
</div>
