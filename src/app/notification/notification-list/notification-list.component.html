<div class="notification-list-container">
  <!-- Panel Header -->
  <div class="notif-panel-header">
    <div class="header-left">
      <h4>Notifications</h4>
      <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </div>
    <div class="header-actions">
      <button mat-icon-button matTooltip="Mark all as read"
              (click)="markAllAsRead()" *ngIf="unreadCount > 0">
        <mat-icon>done_all</mat-icon>
      </button>
      <a mat-icon-button matTooltip="View all" routerLink="/notifications">
        <mat-icon>open_in_new</mat-icon>
      </a>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Notification Items -->
  <div class="notif-items">
    <div class="notif-item" *ngFor="let notification of notifications"
         [class.unread]="!notification.isRead"
         (click)="markAsRead(notification)">
      <div class="notif-icon" [class.unread-icon]="!notification.isRead">
        <mat-icon>{{ getNotificationIcon(notification.type) }}</mat-icon>
      </div>
      <div class="notif-content">
        <span class="notif-title">{{ notification.title }}</span>
        <span class="notif-message">{{ notification.message | truncate:80 }}</span>
        <small class="notif-time">{{ notification.createdAt | timeAgo }}</small>
      </div>
      <div class="notif-unread-dot" *ngIf="!notification.isRead"></div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-notifications" *ngIf="notifications.length === 0">
    <mat-icon>notifications_none</mat-icon>
    <p>No notifications yet</p>
    <small>You're all caught up!</small>
  </div>

  <!-- Footer -->
  <div class="notif-panel-footer" *ngIf="notifications.length > 0">
    <a routerLink="/notifications" class="view-all-link">
      View All Notifications
      <mat-icon>arrow_forward</mat-icon>
    </a>
  </div>
</div>
