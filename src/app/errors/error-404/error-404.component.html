<div class="err-shell tone-404">
  <div class="err-card">
    <div class="badge">404</div>
    <div class="icon-wrap"><mat-icon>travel_explore</mat-icon></div>
    <h1>Page not found</h1>
    <p>That route does not exist, was moved, or the link is broken.</p>
    <div class="actions">
      
      <button type="button" class="btn ghost" (click)="goBack()">Go back</button>
      <button type="button" class="btn primary" (click)="goHome()">Home</button>
    </div>
  </div>
</div>
