<mat-toolbar color="primary" class="app-header">
  <span class="app-title clickable" routerLink="/dashboard">Chat App</span>

  <!-- Primary navigation lives in the left app side-menu (not the header). -->

  <span class="spacer"></span>

  <!-- Notification Bell -->
  <button #notificationButton
          mat-icon-button
          class="notification-bell-btn"
          (click)="toggleNotifications(); $event.stopPropagation()"
          [matBadge]="unreadNotifications > 0 ? (unreadNotifications > 99 ? '99+' : unreadNotifications) : null"
          [matBadgeHidden]="unreadNotifications <= 0"
          matBadgeColor="warn"
          matBadgeSize="small"
          matBadgePosition="above after"
          matBadgeOverlap="true"
          matTooltip="Notifications">
    <mat-icon>notifications</mat-icon>
  </button>

  <!-- User Avatar / Profile panel trigger -->
  <button #profileButton mat-icon-button *ngIf="currentUser" class="user-avatar-btn"
          (click)="toggleProfileMenu(); $event.stopPropagation()"
          matTooltip="Profile">
    <span class="header-avatar-wrap">
      <div class="header-avatar" *ngIf="!headerAvatarSrc || headerAvatarFailed">
        {{ getUserInitials() }}
      </div>
      <img *ngIf="headerAvatarSrc && !headerAvatarFailed"
           [src]="headerAvatarSrc"
           class="header-avatar-img" alt="Profile"
           (error)="onHeaderAvatarError()">
      <span class="header-online-dot" [class.is-online]="isSelfOnline"
            [attr.title]="isSelfOnline ? 'Online' : 'Offline'"></span>
    </span>
  </button>
</mat-toolbar>

<!-- Notification Panel (dropdown with caret) — fade in/out like profile panel -->
<div #notificationPanel class="notification-panel"
     *ngIf="showNotifications"
     [class.closing]="panelClosing"
     (mouseenter)="onPanelMouseEnter()"
     (mouseleave)="onPanelMouseLeave()">
  <div class="notification-caret"></div>
  <app-notification-list
    (viewAll)="viewAllNotifications()"
    (itemOpen)="onNotificationItemOpen()">
  </app-notification-list>
</div>

<!-- Profile Panel — same fade open/close motion as notification bell -->
<div #profilePanel class="profile-panel"
     *ngIf="showProfileMenu"
     [class.closing]="profileMenuClosing"
     (mouseenter)="onProfilePanelMouseEnter()"
     (mouseleave)="onProfilePanelMouseLeave()">
  <div class="profile-caret"></div>
  <div class="user-info-panel">
    <strong>{{ currentUser?.firstName }} {{ currentUser?.lastName }}</strong>
    <small>{{ currentUser?.email }}</small>
    <span class="self-presence" [class.is-online]="isSelfOnline">
      <span class="self-presence-dot"></span>
      {{ isSelfOnline ? 'Online' : 'Offline' }}
    </span>
  </div>
  <mat-divider></mat-divider>
  <button type="button" class="profile-menu-item" (click)="goToProfile()">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button type="button" class="profile-menu-item" (click)="onLogout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</div>
